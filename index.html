<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          var ogFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return ogFetch; },
            set: function(v) { ogFetch = v; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("[FetchPatch] Unable to patch fetch getter/setter:", e);
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <title>Kênh Vô Sự - Lắng đọng tâm hồn, tìm về sự bình yên bên trong</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
